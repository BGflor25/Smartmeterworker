services:
  smartmeter:
    # Published by .github/workflows/docker-publish.yml. Use `docker compose build` with the
    # build line below to build locally instead.
    image: ghcr.io/bgflor25/smartmeterapiparser:latest
    build: ./src/SmartMeter.Worker
    container_name: smartmeter
    restart: unless-stopped
    devices:
      # Prefer the stable by-id path: ls -l /dev/serial/by-id/ on the Pi
      - /dev/ttyUSB0:/dev/ttyUSB0
    group_add:
      - "20" # gid of 'dialout' on the Pi (check: getent group dialout)
    environment:
      Meter__PortName: /dev/ttyUSB0
      Meter__ApiUrl: http://192.168.20.157:8080/api/meterdata/upload
      Meter__Interval: "00:05:00"
      TZ: Europe/Brussels
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
